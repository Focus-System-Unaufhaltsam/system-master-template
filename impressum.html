<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Imprint</title>
  <!-- Lade Konfiguration -->
  <script src="config.js"></script>
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; padding: 40px; max-width: 600px; margin: auto; color:#343536; background: #f5f5f7; }
    h1 { font-weight:900; border-bottom:2px solid #000; padding-bottom:10px; text-transform: uppercase; }
    a { color:#000; font-weight:bold; text-decoration:none; font-size:12px; display:block; margin-top:40px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Imprint</h1>
  <p>Information according to § 5 TMG:</p>
  <p><strong id="uiName"></strong><br><span id="uiStreet"></span><br><span id="uiCity"></span></p>
  <p><strong>Contact:</strong><br>Email: <span id="uiEmail"></span></p>
  <p><strong>Registry:</strong><br><span id="uiReg"></span></p>
  <p><strong>VAT ID:</strong><br><span id="uiUst"></span></p>
  <a href="index.html">← Back to System</a>
  <script>
    // Sicherheits-Check: Falls CLIENT_CONFIG nicht geladen wurde
    if (typeof CLIENT_CONFIG === 'undefined') {
        window.CLIENT_CONFIG = {
            legal: {
                name: "Config not found",
                street: "Please check config.js",
                city: "",
                email: "N/A",
                register: "N/A",
                ustid: "N/A"
            }
        };
    }

    const l = CLIENT_CONFIG.legal || {};
    document.getElementById('uiName').textContent = l.name || "N/A";
    document.getElementById('uiStreet').textContent = l.street || "";
    document.getElementById('uiCity').textContent = l.city || "";
    document.getElementById('uiEmail').textContent = l.email || "N/A";
    document.getElementById('uiReg').textContent = l.register || "N/A";
    document.getElementById('uiUst').textContent = l.ustid || "N/A";
  </script>
</body>
</html>
