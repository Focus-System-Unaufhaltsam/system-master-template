<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Impressum</title>
  
  <!-- LADE KUNDEN-KONFIGURATION -->
  <script src="config.js"></script>
  
  <style>
    body { font-family: Arial, sans-serif; line-height: 1.6; padding: 40px; max-width: 600px; margin: auto; color:#000; background: #f5f5f7; }
    h1 { font-weight:900; border-bottom:2px solid #000; padding-bottom:10px; text-transform: uppercase; }
    a { color:#000; font-weight:bold; text-decoration:none; font-size:12px; opacity:.6; display:block; margin-top:40px; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>Impressum</h1>

  <p>Angaben gemäß § 5 TMG:</p>
  <p>
    <span id="uiImpName">Name</span><br>
    <span id="uiImpStreet">Straße</span><br>
    <span id="uiImpCity">Stadt</span>
  </p>

  <p><strong>Kontakt:</strong><br>
    E-Mail: <span id="uiImpEmail">E-Mail</span>
  </p>

  <p><strong>Verantwortlich für den Inhalt nach § 55 Abs. 2 RStV:</strong><br>
    <span id="uiImpName2">Name</span><br>
    <span id="uiImpStreet2">Straße</span><br>
    <span id="uiImpCity2">Stadt</span>
  </p>

  <a href="index.html">← Zurück zum System</a>

  <script>
    document.getElementById('uiImpName').textContent = CLIENT_CONFIG.impName;
    document.getElementById('uiImpStreet').textContent = CLIENT_CONFIG.impStreet;
    document.getElementById('uiImpCity').textContent = CLIENT_CONFIG.impCity;
    document.getElementById('uiImpEmail').textContent = CLIENT_CONFIG.impEmail;
    
    document.getElementById('uiImpName2').textContent = CLIENT_CONFIG.impName;
    document.getElementById('uiImpStreet2').textContent = CLIENT_CONFIG.impStreet;
    document.getElementById('uiImpCity2').textContent = CLIENT_CONFIG.impCity;
  </script>
</body>
</html>
