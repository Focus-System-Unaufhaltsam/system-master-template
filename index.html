<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title id="uiPageTitle">UNAUFHALTSAM | FOCUS SYSTEM</title>
  
  <!-- Try to load config -->
  <script src="config.js"></script>
  
  <!-- Firebase SDKs (Compat Mode) -->
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

  <style>
    :root { --brand-color: #000; --bg: #f5f5f7; --dark: #343536; --danger: #c92a2a; --success: #0f9d58; }
    * { margin:0; padding:0; box-sizing:border-box; font-family: 'Helvetica Neue', Arial, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background:var(--bg); color:var(--dark); min-height:100vh; padding:20px 14px 40px; overflow-x:hidden; }
    .wrap { width:100%; max-width:980px; margin:0 auto; display:flex; flex-direction:column; gap:18px; }
    .topbar { display:flex; justify-content:space-between; align-items:center; }
    .btn { appearance:none; border:none; background:var(--dark); color:#fff; padding:16px 22px; border-radius:14px; font-weight:900; cursor:pointer; text-transform: uppercase; transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .btn-brand { background: var(--brand-color); color: #fff; }
    .hud { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
    .stat { border:2px solid #000; border-radius:18px; padding:12px; background:#fff; text-align:center; }
    .stat .label { font-size:10px; opacity:.6; text-transform:uppercase; font-weight:800; }
    .stat .value { font-size:28px; font-weight:900; color: var(--brand-color); }
    .game-shell { position:relative; width:100%; background:#fff; border:2px solid #000; border-radius:24px; overflow:hidden; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
    canvas { display:block; width:100%; height:auto; background: radial-gradient(circle, #fff 0%, #eee 100%); touch-action: none; }
    .overlay { position:absolute; inset:0; display:flex; align-items:center; justify-content:center; background:rgba(52, 53, 54, 0.95); backdrop-filter: blur(5px); text-align:center; z-index:100; padding:20px; color: #fff; }
    .hidden { display:none !important; }
    .card { width:min(100%, 480px); background:#fff; border: 2px solid #000; border-top: 4px solid var(--brand-color); padding:35px 25px; color: #000; border-radius: 4px; }
    #errorMsg { color: var(--danger); font-size: 11px; font-weight: 900; display: none; margin-bottom: 10px; text-transform: uppercase; }
    .leaderboard-container { background:#fff; border:2px solid #000; border-radius:22px; padding:20px; }
    .leaderboard-title { font-weight:900; text-transform:uppercase; margin-bottom:12px; border-bottom: 2px solid #000; padding-bottom: 5px; font-size: 13px; }
    .leaderboard-entry { display:flex; justify-content:space-between; padding: 10px 0; border-bottom: 1px solid #eee; font-weight:700; list-style:none; }
    .legal-links { display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
    .legal-links a { font-size: 10px; color: #aaa; text-decoration: none; font-weight: bold; text-transform: uppercase; }
  </style>
</head>
<body>
  <main class="wrap">
    <div class="topbar"><h1 id="uiBrandTitle">UNAUFHALTSAM</h1><button class="btn" onclick="location.reload()">RESET</button></div>
    <section class="hud">
      <div class="stat"><div class="label">Boxes</div><div class="value" id="boxValue">2</div></div>
      <div class="stat"><div class="label">Best</div><div class="value" id="bestValue">0</div></div>
    </section>
    <section class="game-shell">
      <canvas id="gameCanvas" width="960" height="540"></canvas>
      
      <div class="overlay" id="startOverlay">
        <div class="card"><h2 id="uiBrandSub">MISSION</h2><p id="uiStartDesc" style="margin-bottom:20px; color:#666;"></p><button class="btn btn-brand" id="startBtn" style="width:100%;">START MISSION</button>
        <div class="legal-links"><a href="impressum.html">Imprint</a><a href="datenschutz.html">Privacy</a></div></div>
      </div>

      <div class="overlay hidden" id="nameOverlay">
        <div class="card"><h2>FOCUS CONFIRMED!</h2><p style="font-size: 12px; margin-bottom: 15px;">Secure your spot in the global ranking:</p><div id="errorMsg">NAME TAKEN</div><input type="text" id="nameInput" placeholder="YOUR NAME" maxlength="15" style="width:100%; padding:15px; margin-bottom:15px; border:1px solid #ccc; text-align:center; font-weight:bold; outline:none; text-transform:uppercase;" /><button class="btn btn-brand" id="saveScoreBtn" style="width:100%;">SAVE RANK</button></div>
      </div>

      <div class="overlay hidden" id="gameOverOverlay">
        <div class="card"><h2 id="uiGameOverTitle" style="color:var(--danger)">FAILED</h2><p id="aiText" style="font-size:13px; font-weight:bold; font-style:italic; margin:15px 0; min-height:40px; color:#555;"></p><div id="finalScore" style="font-size:60px; font-weight:900;">0</div><p id="finalTime" style="font-size:16px; font-weight:900; color:var(--brand-color); margin-bottom:20px;">0.00s</p>
        <div id="rewardSection" style="display:none; background:#f9f9f9; padding:15px; border-left:4px solid var(--brand-color); text-align: left;"><p id="uiRewardTitle" style="font-size:11px; font-weight:900; margin-bottom:10px;"></p><input type="text" id="igInput" placeholder="INSTAGRAM / MAIL" style="width:100%; padding:12px; margin-bottom:10px; border:1px solid #ccc; font-weight: bold;"><button class="btn btn-brand" id="claimBtn" style="width:100%;">CLAIM NOW</button></div><button class="btn" onclick="location.reload()" style="margin-top:15px; width: 100%;">REBOOT</button></div>
      </div>
    </section>
    <section class="leaderboard-container"><div style="font-weight:900; margin-bottom:10px; text-transform: uppercase;">Global Elite Ranking</div><div id="leaderboardList"></div></section>
  </main>

  <script>
    // 0. SAFETY FALLBACK IF config.js IS MISSING
    if (typeof CLIENT_CONFIG === 'undefined') {
        window.CLIENT_CONFIG = {
            id: "master-template-v1",
            brandColor: "#b01fa5",
            brandTitle: "UNAUFHALTSAM",
            brandSub: "PRECISION CHALLENGE",
            startDesc: "Focus target box. Any mistake ends the system.",
            boxOverlayText: "FOCUS",
            rewardTitle: "ELITE STATUS REACHED: CLAIM REWARD",
            rewardSuccess: "CLAIMED. YOU WILL BE CONTACTED.",
            easterEggScore: 29,
            quotes: ['"Focus is a choice. You just chose against it."','"Waking up. Mental work begins."']
        };
    }

    // 1. UI INITIALIZATION
    document.documentElement.style.setProperty('--brand-color', CLIENT_CONFIG.brandColor);
    document.getElementById('uiPageTitle').textContent = CLIENT_CONFIG.brandTitle + " | FOCUS";
    document.getElementById('uiBrandTitle').textContent = CLIENT_CONFIG.brandTitle;
    document.getElementById('uiBrandSub').textContent = CLIENT_CONFIG.brandSub;
    document.getElementById('uiStartDesc').textContent = CLIENT_CONFIG.startDesc;
    document.getElementById('uiRewardTitle').textContent = CLIENT_CONFIG.rewardTitle;

    // 2. FIREBASE ENGINE
    const firebaseConfig = { apiKey: "AIzaSyC0olKESyTP0rXUlnjGstLlGN50I1m_O2A", authDomain: "mg-challenge.firebaseapp.com", projectId: "mg-challenge", storageBucket: "mg-challenge.firebasestorage.app", messagingSenderId: "472289048663", appId: "1:472289048663:web:cc68ded6007e1e822c4b12" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.firestore(); const auth = firebase.auth();
    const dbRef = db.collection('artifacts').doc(CLIENT_CONFIG.id).collection('public').doc('data').collection('leaderboard');
    
    const canvas = document.getElementById("gameCanvas"); const ctx = canvas.getContext("2d");
    const imgLogo = new Image(); imgLogo.src = "logo.png";
    const BEST_KEY = "focusBest_" + CLIENT_CONFIG.id;

    let state = { running:false, score:0, startTime:0, totalTime:0, phase:"idle", phaseStartedAt:0, boxes:[], correctId:null, selectedId:null, swapsRemaining:0, activeSwap:null, cachedLB:[] };

    function getAIQuote(s) { const i = Math.floor(s / 5); return CLIENT_CONFIG.quotes[Math.min(i, 5)]; }

    function buildRound() {
        if (state.score >= CLIENT_CONFIG.easterEggScore) { finish(true); return; }
        state.boxes = []; state.selectedId = null;
        const count = Math.min(30, 2 + state.score); const cols = Math.ceil(Math.sqrt(count));
        const boxW = Math.max(45, Math.min(92, (canvas.width-160)/cols-24));
        const startX = (canvas.width - (cols*boxW+(cols-1)*24))/2;
        const startY = 160 + ((canvas.height-200)-(Math.ceil(count/cols)*boxW+(Math.ceil(count/cols)-1)*24))/2;
        for(let i=0; i<count; i++) state.boxes.push({ id:i, x:startX+(i%cols)*(boxW+24), y:startY+Math.floor(i/cols)*(boxW+24), w:boxW, h:boxW, lift:0 });
        state.correctId = Math.floor(Math.random()*count); state.swapsRemaining = Math.max(4, 3+Math.floor(count*1.5));
        setPhase("show"); document.getElementById("boxValue").textContent = count;
    }

    function startNextSwap() {
        if (state.swapsRemaining <= 0) { state.activeSwap = null; setPhase("wait"); return; }
        let a = Math.floor(Math.random()*state.boxes.length), b = Math.floor(Math.random()*state.boxes.length);
        while (b === a) b = Math.floor(Math.random()*state.boxes.length);
        const bA = state.boxes[a], bB = state.boxes[b];
        state.activeSwap = { aId: bA.id, bId: bB.id, aStartX: bA.x, bStartX: bB.x, aStartY: bA.y, bStartY: bB.y, aTargetX: bB.x, bTargetX: bA.x, aTargetY: bB.y, bTargetY: bA.y, start: performance.now(), duration: Math.max(160, (2200 - state.score * 85) / 7.5) };
        state.swapsRemaining--;
    }

    function update(ts) {
        if (!state.running) return;
        if (state.phase === "show" && ts - state.phaseStartedAt > 1400) { setPhase("shuffle"); startNextSwap(); }
        else if (state.phase === "shuffle") {
            if (!state.activeSwap) { startNextSwap(); return; }
            const s = state.activeSwap; const p = Math.min(1, (ts - s.start) / s.duration); const e = p < 0.5 ? 2*p*p : 1-Math.pow(-2*p+2,2)/2;
            const bA = state.boxes.find(b => b.id === s.aId), bB = state.boxes.find(b => b.id === s.bId);
            if(bA && bB) { bA.x = s.aStartX + (s.aTargetX - s.aStartX) * e; bB.x = s.bStartX + (s.bTargetX - s.bStartX) * e; bA.y = s.aStartY + (s.aTargetY - s.aStartY) * e; bB.y = s.bStartY + (s.bTargetY - s.bStartY) * e; if (p >= 1) { bA.x = s.aTargetX; bA.y = s.aTargetY; bB.x = s.bTargetX; bB.y = s.bTargetY; state.activeSwap = null; } }
        } else if (state.phase === "wait" && ts - state.phaseStartedAt > 300) setPhase("pick");
        else if (state.phase === "reveal") {
            const sel = state.boxes.find(b => b.id === state.selectedId), cor = state.boxes.find(b => b.id === state.correctId);
            if (sel) sel.lift = Math.min(sel.h * 0.8, sel.lift + 5);
            if (cor && cor.id !== state.selectedId) cor.lift = Math.min(cor.h * 0.8, cor.lift + 5);
            if (ts - state.phaseStartedAt > 1200) { if (state.selectedId === state.correctId) { state.score++; buildRound(); } else finish(false); }
        }
        if (state.phase !== "reveal") state.boxes.forEach(b => b.lift = Math.max(0, b.lift - 6));
    }

    function draw() {
        ctx.clearRect(0,0,canvas.width,canvas.height);
        state.boxes.forEach(box => {
            const y = box.y - box.lift; ctx.save(); ctx.fillStyle="#fff"; ctx.strokeStyle="#000"; ctx.lineWidth=3;
            ctx.strokeRect(box.x,y,box.w,box.h); ctx.fillRect(box.x,y,box.w,box.h);
            if(imgLogo.complete && imgLogo.width > 0) { const pad = box.w * 0.12; ctx.drawImage(imgLogo, box.x+pad, y+pad, box.w-pad*2, box.h-pad*2); }
            if(state.phase==="show" && box.id===state.correctId) {
                ctx.strokeStyle=CLIENT_CONFIG.brandColor; ctx.lineWidth=6; ctx.strokeRect(box.x-4,y-4,box.w+8,box.h+8);
                ctx.font="900 20px Arial"; ctx.textAlign="center"; ctx.strokeStyle="#000"; ctx.lineWidth=4; ctx.strokeText(CLIENT_CONFIG.boxOverlayText, box.x+box.w/2, y+box.h/2); ctx.fillStyle="#fff"; ctx.fillText(CLIENT_CONFIG.boxOverlayText, box.x+box.w/2, y+box.h/2);
            }
            if(state.phase==="reveal" && box.id===state.correctId) { ctx.fillStyle=CLIENT_CONFIG.brandColor; ctx.font="40px Arial"; ctx.textAlign="center"; ctx.textBaseline="middle"; ctx.fillText("👑", box.x+box.w/2, y+box.h/2); }
            ctx.restore();
        });
    }

    function finish(v) {
        state.running=false; state.totalTime=(performance.now()-state.startTime)/1000;
        document.getElementById("gameOverOverlay").classList.remove("hidden");
        const fbxs = Math.min(30, state.score+2);
        document.getElementById("finalScore").textContent = fbxs + " BOXES";
        document.getElementById("finalTime").textContent = `TIME: ${state.totalTime.toFixed(2)}s`;
        document.getElementById("aiText").textContent = getAIQuote(state.score);
        if (v) { document.getElementById("uiGameOverTitle").textContent = "ELITE CONFIRMED"; document.getElementById("uiGameOverTitle").style.color = "var(--success)"; }
        const best = Number(localStorage.getItem(BEST_KEY) || 0); if(state.score > best) localStorage.setItem(BEST_KEY, state.score);
        document.getElementById("bestValue").textContent = Math.max(best, state.score) + 2;
        if(state.score+2>=30 || v) document.getElementById("rewardSection").style.display="block";
        if(state.score>0) document.getElementById("nameOverlay").classList.remove("hidden");
    }

    auth.onAuthStateChanged(user => {
        if(user) dbRef.onSnapshot(snap => {
            const list = document.getElementById("leaderboardList"); list.innerHTML = ""; state.cachedLB = [];
            snap.forEach(d => state.cachedLB.push({...d.data(), uid:d.id}));
            state.cachedLB.sort((a,b) => (b.score||0)-(a.score||0) || (a.time||999)-(b.time||999));
            state.cachedLB.slice(0,5).forEach(d => { list.innerHTML += `<div class="leaderboard-entry"><span>${d.name}</span><span>${Math.min(30, (d.score||0)+2)} (${(d.time||0).toFixed(1)}s)</span></div>`; });
        });
    });
    auth.signInAnonymously();

    document.getElementById("startBtn").onclick = () => { state.running=true; state.score=0; state.startTime=performance.now(); document.getElementById("startOverlay").classList.add("hidden"); buildRound(); };
    document.getElementById("saveScoreBtn").onclick = async () => {
        const name = document.getElementById("nameInput").value.trim().toUpperCase(); if(!name) return;
        if(state.cachedLB.some(e => e.name===name && e.uid!==auth.currentUser.uid)) { document.getElementById("errorMsg").style.display="block"; return; }
        await dbRef.doc(auth.currentUser.uid).set({ name, score:state.score, time:state.totalTime, timestamp:firebase.firestore.FieldValue.serverTimestamp() });
        location.reload();
    };
    document.getElementById("claimBtn").onclick = async () => {
        const ig = document.getElementById("igInput").value.trim(); if(!ig) return;
        await db.collection('artifacts').doc(CLIENT_CONFIG.id).collection('public').doc('data').collection('claims').add({ ig, score: state.score+2, time: state.totalTime, timestamp: firebase.firestore.FieldValue.serverTimestamp() });
        document.getElementById("rewardSection").innerHTML = `<p style='font-size:12px; font-weight:900; color:var(--success)'>${CLIENT_CONFIG.rewardSuccess}</p>`;
    };
    canvas.onmousedown = e => { const r = canvas.getBoundingClientRect(); const x = (e.clientX-r.left)*(canvas.width/r.width), y = (e.clientY-r.top)*(canvas.height/r.height); if(state.phase==="pick") state.boxes.forEach(b => { if(x>=b.x && x<=b.x+b.w && y>=b.y-b.lift && y <=b.y-b.lift+b.h) { state.selectedId = b.id; setPhase("reveal"); } }); };
    function setPhase(p){ state.phase=p; state.phaseStartedAt=performance.now(); }
    function loop(ts){ if(state.running) update(ts); draw(); requestAnimationFrame(loop); }
    requestAnimationFrame(loop);
  </script>
</body>
</html>
